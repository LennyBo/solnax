<div class="cooldown-card" [class.active]="active()" [class.eco]="mode() === 'ECO_PLUS'">
  <div class="status">
    <span class="indicator"></span>
    <span class="label">
      {{ formatMode(mode()) }}
      <small class="description">{{ modeDescription() }}</small>
      <small class="until" *ngIf="active() && endsAt()">until {{ endsAt() | date:'short' }}</small>
    </span>
  </div>

  <div class="actions">
    <button
      class="btn primary"
      (click)="activate('MANUAL')"
      [disabled]="mode() === 'MANUAL' || loading()">
      Manual
    </button>

    <button
      class="btn eco"
      (click)="activate('ECO_PLUS')"
      [disabled]="mode() === 'ECO_PLUS' || loading()">
      Eco+
    </button>

    <button
      class="btn neutral"
      (click)="backToNormal()"
      [disabled]="!active() || loading()">
      Normal
    </button>

    <button
      class="btn danger"
      (click)="clearCoolDown()"
      [disabled]="loading()">
      Clear
    </button>
  </div>
</div>

<!-- Active Cooldowns Details -->
<div class="cooldown-details" *ngIf="cooldowns().length > 0">
  <h4>Active Cooldowns</h4>
  <div class="cooldown-item" *ngFor="let cd of cooldowns()">
    <span class="cd-target">{{ cd.target }}</span>
    <span class="cd-reason">{{ formatReason(cd.reason) }}</span>
    <span class="cd-remaining">{{ cd.minutesRemaining }} min left</span>
  </div>
</div>

<!-- Toast -->
<div class="toast" *ngIf="toast()" [class]="toast()?.type">
  {{ toast()?.message }}
</div>
